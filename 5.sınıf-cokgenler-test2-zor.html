    font-size: 13px;

  .secenek.yanlis { background: #fee2e2 !important; border-color: #dc2626 !important; color: #991b1b; font-weight: 700; }

    grid-column: 1 / -1;
    background: linear-gradient(90deg,#6366f1,#8b5cf6);
    color: #fff;
    border-radius: 12px;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 800;
    margin-top: 10px;
    margin-bottom: 2px;
    letter-spacing: 0.5px;
  }

    background: linear-gradient(135deg,#6366f1,#8b5cf6);
    color: #fff;
    border: none; border-radius: 14px;
    padding: 14px 36px;
    font-size: 17px; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(99,102,241,0.25);

  .btn-temizle {
    background: #fff;
    color: #6366f1;
    border: 2px solid #6366f1;
    border-radius: 14px;
    padding: 14px 36px;
    font-size: 17px; font-weight: 800;
    cursor: pointer;
    transition: background 0.15s;
  }

    background: linear-gradient(135deg,#6366f1,#a855f7);
    color: #fff;
    border-radius: 22px;
    padding: 36px 40px;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    box-shadow: 0 8px 32px rgba(99,102,241,0.3);

    background: #fffbeb;
    border: 1.5px solid #fbbf24;
    border-radius: 8px;

// ===================== OLUŞTURMA =====================
function soruHTML(s, idx) {
  let svgHtml = s.svg ? `<div style="display:flex;justify-content:center;margin:8px 0;">${s.svg}</div>` : '';
  let notHtml = s.not ? `<div class="not-kutusu">📌 Not: ${s.not}</div>` : '';
  let secHtml = '';
  const harfler = ['A','B','C','D'];
  s.secenekler.forEach((sec, i) => {
    secHtml += `<label class="secenek" id="lbl_${idx}_${harfler[i]}">
      <input type="radio" name="s${idx}" value="${harfler[i]}">
      <span>${sec}</span>
    </label>`;
  });
  return `
    <div class="soru-kart" id="kart_${idx}">
      <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;">
        <div class="soru-no">${idx+1}</div>
        <p style="font-weight:700;color:#1f2937;font-size:13.5px;line-height:1.45;margin-top:4px;">${s.soru}</p>
      </div>
      ${svgHtml}
      ${notHtml}
      <div style="margin-top:8px;">${secHtml}</div>
      <div id="aciklama_${idx}" style="display:none;margin-top:8px;font-size:12px;font-weight:700;border-radius:8px;padding:6px 12px;"></div>
    </div>`;
}

  const grid = document.getElementById('sorular-grid');
  let html = '';
  let currentBolum = null;
  sorular.forEach((s, i) => {
    if (s.bolum && s.bolum !== currentBolum) {
      currentBolum = s.bolum;
      html += `<div class="bolum-baslik">${s.bolum}</div>`;
    }
    html += soruHTML(s, i);
  });
  grid.innerHTML = html;
};

function kontrol() {
  let dogru = 0, yanlis = 0, bos = 0;
  sorular.forEach((s, i) => {
    const harfler = ['A','B','C','D'];
    const secilen = document.querySelector(`input[name="s${i}"]:checked`);
    const aciklama = document.getElementById(`aciklama_${i}`);
    harfler.forEach(h => {
      const lbl = document.getElementById(`lbl_${i}_${h}`);
      if (lbl) lbl.classList.remove('dogru','yanlis');
    });
    if (!secilen) {
      bos++;
      aciklama.style.background = '#fefce8';
      aciklama.style.color = '#92400e';
      aciklama.style.border = '1.5px solid #fbbf24';
      aciklama.textContent = '⚠️ Bu soruyu boş bıraktınız. Doğru cevap: ' + s.dogru + ') ' + s.secenekler[['A','B','C','D'].indexOf(s.dogru)];
      aciklama.style.display = 'block';
      const lbl = document.getElementById(`lbl_${i}_${s.dogru}`);
      if (lbl) lbl.classList.add('dogru');
    } else if (secilen.value === s.dogru) {
      dogru++;
      const lbl = document.getElementById(`lbl_${i}_${s.dogru}`);
      if (lbl) lbl.classList.add('dogru');
      aciklama.style.background = '#d1fae5';
      aciklama.style.color = '#065f46';
      aciklama.style.border = '1.5px solid #059669';
      aciklama.textContent = '✅ Doğru!';
      aciklama.style.display = 'block';
    } else {
      yanlis++;
      const lblY = document.getElementById(`lbl_${i}_${secilen.value}`);
      if (lblY) lblY.classList.add('yanlis');
      const lblD = document.getElementById(`lbl_${i}_${s.dogru}`);
      if (lblD) lblD.classList.add('dogru');
      aciklama.style.background = '#fee2e2';
      aciklama.style.color = '#991b1b';
      aciklama.style.border = '1.5px solid #dc2626';
      aciklama.textContent = '❌ Yanlış! Doğru cevap: ' + s.dogru + ') ' + s.secenekler[['A','B','C','D'].indexOf(s.dogru)];
      aciklama.style.display = 'block';
    }
  });
  const toplam = sorular.length;
  const puan = Math.round((dogru/toplam)*100);
  let emoji = puan >= 85 ? '🏆' : puan >= 70 ? '⭐' : puan >= 50 ? '📚' : '💪';
  let mesaj = puan >= 85 ? 'Mükemmel!' : puan >= 70 ? 'Çok iyi!' : puan >= 50 ? 'Fena değil, çalışmaya devam!' : 'Biraz daha çalışalım!';
  const sonuc = document.getElementById('sonuc-alan');
  sonuc.innerHTML = `<div class="sonuc-kutu">
    ${emoji} ${mesaj}<br>
    <span style="font-size:32px;font-weight:900;">${puan}</span>/100 Puan<br>
    <span style="font-size:16px;font-weight:600;">✅ Doğru: ${dogru} &nbsp;|&nbsp; ❌ Yanlış: ${yanlis} &nbsp;|&nbsp; ⬜ Boş: ${bos} &nbsp;|&nbsp; Toplam: ${toplam}</span>
  </div>`;
  sonuc.style.display = 'block';
  sonuc.scrollIntoView({behavior:'smooth'});
}

function temizle() {
  document.getElementById('testForm').reset();
  sorular.forEach((s, i) => {
    const harfler = ['A','B','C','D'];
    harfler.forEach(h => {
      const lbl = document.getElementById(`lbl_${i}_${h}`);
      if (lbl) lbl.classList.remove('dogru','yanlis');
    });
    const aciklama = document.getElementById(`aciklama_${i}`);
    if (aciklama) { aciklama.style.display = 'none'; aciklama.textContent = ''; }
  });
  document.getElementById('sonuc-alan').style.display = 'none';
  window.scrollTo({top:0, behavior:'smooth'});
}
